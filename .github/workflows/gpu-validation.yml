name: Triton SiLU strided-input CUDA validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, Windows, X64, flashinfer-gpu-a8eedc6a75]
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    env:
      MASK_MACHINE: ${{ secrets.MASK_MACHINE }}
      MASK_USER: ${{ secrets.MASK_USER }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      GIT_TERMINAL_PROMPT: '0'
      CC: 'C:\PR\flashinfer-triton-windows-20261108\triton\runtime\tcc\tcc.exe'
      CUDA_PATH: 'C:\PR\flashinfer-triton-windows-20261108\triton\backends\nvidia'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify pinned sources and GPU
        run: |
          & 'C:\PR\kvpress-gpu-venv-20261107\Scripts\python.exe' -c "import hashlib,pathlib; pairs=[('flashinfer/triton/activation.py','45006dd1805fc2a541fa7721b632131e1b5ce7d3b267bbe4b997d137fc33b0c7'),('flashinfer/triton/kernels/activation.py','2d90c139c68d6f6a482459cdd6c20b4d4e283bc44e8f5ff2e24152a8216a9efc'),('flashinfer/triton/kernels/quant.py','6b45d22b3e87b7a501d6493d310d629d3b8b41e1c459d0844794ac0c96b94c05'),('tests/utils/test_triton_activation.py','4bb401fda925d2c933120c3e258d3d5f6b24c01f601c5cb3a25797c7dbf5dc8b'),('baseline_activation.py','4d601d95b6eda38fa0b43b549dcae3d18f1925947e3ce88fd93a95b4b267313c'),('baseline_kernel.py','05c3d886cf261d0483f8616bbed22e968e2c6ba1f84b2c083b9e7d1f8410d868'),('flashinfer_activation_test_adapter_20261108.py','1550d0b7a8dc68e74182fd6c433b7f398f3dd6c46d789005fc8a9095f894d5d7')]; assert all(hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()==h for p,h in pairs); print('All source hashes verified')"
          if ($LASTEXITCODE -ne 0) { throw 'Source hash verification failed' }
          Write-Host 'FlashInfer commit: 6608c619a617cfad7ae4bf079e6f6d4a63f0c2c9'
          Write-Host 'Original upstream commit: 11bf37df449b8b478e858e7a8ba432976b28457e'
          nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv,noheader
          if ($LASTEXITCODE -ne 0) { throw 'nvidia-smi failed' }
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE;C:\PR\flashinfer-triton-windows-20261108"
          & 'C:\PR\kvpress-gpu-venv-20261107\Scripts\python.exe' -c "import torch,triton; assert torch.cuda.is_available(); print('GPU:',torch.cuda.get_device_name(0),'PyTorch:',torch.__version__,'CUDA:',torch.version.cuda,'Triton:',triton.__version__)"
          if ($LASTEXITCODE -ne 0) { throw 'GPU check failed' }
      - name: Confirm baseline failures
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE;C:\PR\flashinfer-triton-windows-20261108"
          $baseline = Join-Path $env:RUNNER_TEMP ("flashinfer-baseline-" + $env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Force -Path $baseline | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'flashinfer') -Destination $baseline -Recurse
          Copy-Item -LiteralPath 'baseline_activation.py' -Destination (Join-Path $baseline 'flashinfer/triton/activation.py') -Force
          Copy-Item -LiteralPath 'baseline_kernel.py' -Destination (Join-Path $baseline 'flashinfer/triton/kernels/activation.py') -Force
          $env:FLASHINFER_SOURCE_ROOT = $baseline
          $test = Join-Path $env:GITHUB_WORKSPACE 'tests/utils/test_triton_activation.py'
          $output = & 'C:\PR\kvpress-gpu-venv-20261107\Scripts\python.exe' -m pytest -p flashinfer_activation_test_adapter_20261108 --noconftest -o addopts='' $test -q --tb=no 2>&1 | Out-String
          $testExit = $LASTEXITCODE
          Write-Host $output
          if ($testExit -ne 1 -or $output -notmatch '24 failed, 12 passed') { throw 'Unexpected baseline result' }
          exit 0
      - name: Run patched Triton kernel on CUDA
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE;C:\PR\flashinfer-triton-windows-20261108"
          $env:FLASHINFER_SOURCE_ROOT = $env:GITHUB_WORKSPACE
          $test = Join-Path $env:GITHUB_WORKSPACE 'tests/utils/test_triton_activation.py'
          & 'C:\PR\kvpress-gpu-venv-20261107\Scripts\python.exe' -m pytest -p flashinfer_activation_test_adapter_20261108 --noconftest -o addopts='' $test -q --tb=short
          if ($LASTEXITCODE -ne 0) { throw 'Patched CUDA tests failed' }

  pre-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bingdongni/flashinfer
          ref: 6608c619a617cfad7ae4bf079e6f6d4a63f0c2c9
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run repository hooks on changed files
        run: |
          python -m pip install pre-commit
          pre-commit run --files flashinfer/triton/activation.py flashinfer/triton/kernels/activation.py tests/utils/test_triton_activation.py
